name: Weekly project report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * 5"

permissions:
  contents: read
  issues: write

jobs:
  create-report-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create weekly report issue
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const taskIssues = issues.filter(issue => !issue.pull_request);
            const blocked = taskIssues.filter(issue =>
              issue.labels.some(label => label.name === "bloqueio")
            );

            const body = [
              "# Relatorio semanal do projeto",
              "",
              `Issues abertas: ${taskIssues.length}`,
              `Bloqueios abertos: ${blocked.length}`,
              "",
              "## Itens em aberto",
              ...taskIssues.map(issue => `- #${issue.number} ${issue.title}`),
              "",
              "## Bloqueios",
              ...(blocked.length
                ? blocked.map(issue => `- #${issue.number} ${issue.title}`)
                : ["- Nenhum bloqueio registrado."]),
              "",
              "## Proximas acoes sugeridas",
              "1. Revisar issues sem atualizacao recente.",
              "2. Priorizar bloqueios antes de iniciar novas tarefas.",
              "3. Atualizar o GitHub Project com status e prazos.",
              "",
              "> Este relatorio foi gerado automaticamente por GitHub Actions."
            ].join("\n");

            await github.rest.issues.create({
              owner,
              repo,
              title: `Relatorio semanal - ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ["relatorio"]
            });

