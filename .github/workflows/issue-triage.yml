name: Issue triage helper

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write

jobs:
  add-suggested-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Add labels based on issue content
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ""}`.toLowerCase();
            const labels = new Set();

            if (text.includes("referencia") || text.includes("artigo") || text.includes("fonte")) {
              labels.add("pesquisa");
            }
            if (text.includes("slide") || text.includes("apresentacao")) {
              labels.add("slides");
            }
            if (text.includes("revisao") || text.includes("corrigir")) {
              labels.add("revisao");
            }
            if (text.includes("bloqueio") || text.includes("impedido") || text.includes("atraso")) {
              labels.add("bloqueio");
            }

            if (labels.size === 0) {
              labels.add("tarefa");
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [...labels]
            });

